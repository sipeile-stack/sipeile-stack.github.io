<style>

}

body {
  background: #faf9f6;

  font-family: -apple-system, BlinkMacSystemFont,
  "Helvetica Neue", "PingFang SC", sans-serif;
  line-height: 1.8;
}

a {
  color: inherit;
  text-decoration: none;
}

header {

  letter-spacing: 1.5px;

  transition: color 0.3s ease;
}

.logo:hover {
  color: #a17b51;
}

nav {
  display: flex;
  align-items: center;
  gap: 32px;
  font-size: 13px;
  letter-spacing: 0.5px;
}

nav a {
  color: #555;
  transition: color 0.3s ease;
}

nav a:hover {
  color: #a17b51;
}

nav a:hover {
  color: #a17b51;
}

.hero {
  max-width: 1100px;
  margin: 90px auto 75px;
  padding: 0 24px;
}

.eyebrow {
  color: #a17b51;
  font-size: 12px;
  letter-spacing: 3px;
  margin-bottom: 20px;
}

.hero h1 {
  font-size: clamp(38px, 7vw, 70px);
  line-height: 1.25;
  letter-spacing: -2px;
  max-width: 800px;
}

.hero p {
  color: #777;
  margin-top: 25px;
  font-size: 16px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 0 24px 80px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #e9e6df;
  padding-bottom: 18px;
  margin-bottom: 30px;
}

.section-title h2 {
  font-size: 23px;
}

.articles {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px;
}
  
.search-area {
  margin-bottom: 30px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #fff;
  border: 1px solid #eeeae3;
  border-radius: 8px;
  padding: 13px 18px;
  margin-bottom: 20px;
}

.search-box span {
  font-size: 24px;
  color: #a17b51;
}

.search-box input {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  font-size: 14px;
  color: #252525;
  font-family: inherit;
}

.search-box input::placeholder {
  color: #aaa;
}

.category-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.filter-btn {
  border: 1px solid #e9e6df;
  background: transparent;
  color: #777;
  padding: 7px 18px;
  border-radius: 30px;
  cursor: pointer;
  font-size: 13px;
  transition: all .2s;
  font-family: inherit;
}

.filter-btn:hover,
.filter-btn.active {
  background: #a17b51;
  border-color: #a17b51;
  color: #fff;
}


.card {
  background: #fff;
  border: 1px solid #eeeae3;
  border-radius: 10px;
  padding: 30px;
  transition: transform .2s, box-shadow .2s;
  display: block;
color: inherit;
text-decoration: none;
}
  .card {
  cursor: pointer;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 30px #00000008;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 30px #00000008;
}

.category {
  font-size: 12px;
  color: #a17b51;
  letter-spacing: 1px;
}

.card h3 {
  font-size: 22px;
  margin: 16px 0 12px;
}
  .card h3 a {
  color: inherit;
  text-decoration: none;
  cursor: pointer;
}

.card h3 a:hover {
  color: #a17b51;
  text-decoration: underline;
}

.card p {
  color: #888;
  font-size: 14px;
}

.date {
  color: #aaa;
  font-size: 12px;
  margin-top: 22px;
}

.about {
  background: #f0ede6;
  border-radius: 12px;
  padding: 45px;
  margin-top: 75px;
}

.about h2 {
  font-size: 26px;
  margin-bottom: 15px;
}

.about p {
  color: #666;
  max-width: 650px;
}

footer {
  text-align: center;
  padding: 35px 20px;
  border-top: 1px solid #e9e6df;
  color: #999;
  font-size: 13px;
}

@media (max-width: 650px) {
  header {
    flex-direction: column;
    gap: 15px;
  }

  nav {
    gap: 16px;
  }

  .hero {
    margin-top: 65px;
  }

  .articles {
    grid-template-columns: 1fr;
  }

  .about {

</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">SPL JOURNAL.</a>

  <nav>
    <a href="index.html">首页</a>
    <a href="#articles">文章</a>
    <a href="archive.html">归档</a>
    <a href="#about">关于</a>
  </nav>
</header>
<section class="hero">
  <div class="eyebrow">WELCOME TO MY WORLD</div>

  <h1>记录生活，<br>记录思考，记录世界。</h1>

  <p>
    这里是我的个人博客。<br>
    分享科技、生活、阅读，以及那些值得记录的瞬间。
  </p>
</section>

<main class="container">

  <section id="articles">

    <div class="section-title">
      <h2>最新文章</h2>
      <span class="category">LATEST POSTS</span>
    </div>


<div class="search-area">

  <div class="search-box">
    <span>⌕</span>
    <input
      type="text"
      id="search-input"
      placeholder="搜索文章标题或关键词..."
    >
  </div>

  <div class="category-filters" id="category-filters">
    <button class="filter-btn active" data-category="全部">全部</button>
    <button class="filter-btn" data-category="科技">科技</button>
    <button class="filter-btn" data-category="生活">生活</button>
    <button class="filter-btn" data-category="思考">思考</button>
    <button class="filter-btn" data-category="随笔">随笔</button>
  </div>

</div>

<div class="articles" id="article-list">
  <p>正在加载文章...</p>
</div>

  </section>

  <section class="about" id="about">
    <h2>关于我</h2>
    <p>
      一个对科技、互联网和世界充满好奇的人。
      喜欢探索新事物，也喜欢记录自己的思考。
      希望通过文字，留下值得回忆的东西。
    </p>
  </section>

</main>

<footer>
  © 2026 MY JOURNAL. ALL RIGHTS RESERVED.
  <br>
  Made with curiosity.
</footer>


<script>
let allPosts = [];
let currentCategory = "全部";

async function loadArticles() {
  const container = document.getElementById("article-list");

  try {
    const response = await fetch("posts.json");

    if (!response.ok) {
      throw new Error("无法读取 posts.json");
    }

    const posts = await response.json();

    if (!Array.isArray(posts)) {
      throw new Error("文章清单格式不正确");
    }

    allPosts = posts.filter(post =>
      typeof post.file === "string" &&
      post.file.startsWith("posts/") &&
      !post.file.includes("..") &&
      /\.(md|html)$/i.test(post.file)
    );

    renderArticles();

  } catch (error) {
    console.error(error);
    container.textContent = "文章加载失败，请检查 posts.json 文件。";
  }
}

function renderArticles() {
  const container = document.getElementById("article-list");
  const keyword = document
    .getElementById("search-input")
    .value
    .trim()
    .toLowerCase();

  container.replaceChildren();

  const filteredPosts = allPosts.filter(post => {
    const matchesCategory =
      currentCategory === "全部" ||
      post.category === currentCategory;

    const searchableText = [
      post.title,
      post.category,
      post.description
    ].join(" ").toLowerCase();

    const matchesKeyword = searchableText.includes(keyword);

    return matchesCategory && matchesKeyword;
  });

  if (filteredPosts.length === 0) {
    container.textContent = "没有找到相关文章。";
    return;
  }

  filteredPosts.forEach(post => {
    const card = document.createElement("a");
    card.className = "card";

    card.href = post.file.endsWith(".md")
      ? "post.html?file=" + encodeURIComponent(post.file)
      : post.file;

    const category = document.createElement("div");
    category.className = "category";
    category.textContent = post.category || "随笔";

    const title = document.createElement("h3");
    title.textContent = post.title || "未命名文章";

    const description = document.createElement("p");
    description.textContent = post.description || "";

    const date = document.createElement("div");
    date.className = "date";
    date.textContent = post.date || "";

    card.append(category, title, description, date);
    container.appendChild(card);
  });
}

document.getElementById("search-input").addEventListener(
  "input",
  renderArticles
);

document.getElementById("category-filters").addEventListener(
  "click",
  event => {
    const button = event.target.closest(".filter-btn");

    if (!button) return;

    currentCategory = button.dataset.category;

    document.querySelectorAll(".filter-btn").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    renderArticles();
  }
);

loadArticles();
</script>
</body>
</html>
