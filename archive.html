
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章归档 | SPL JOURNAL</title>
<meta name="description" content="SPL JOURNAL 文章归档。">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #faf9f6;
  color: #252525;
  font-family: -apple-system, BlinkMacSystemFont,
  "Helvetica Neue", "PingFang SC", sans-serif;
  line-height: 1.8;
}

a {
  color: inherit;
  text-decoration: none;
}

header {
  max-width: 1100px;
  margin: auto;
  padding: 28px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #e9e6df;
}

.logo {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 1px;
}

nav {
  display: flex;
  gap: 25px;
  font-size: 14px;
}

nav a:hover {
  color: #a17b51;
}

.container {
  max-width: 900px;
  margin: 85px auto;
  padding: 0 24px 80px;
}

.eyebrow {
  color: #a17b51;
  font-size: 12px;
  letter-spacing: 3px;
}

h1 {
  font-size: clamp(38px, 7vw, 62px);
  margin: 15px 0;
  letter-spacing: -2px;
}

.intro {
  color: #888;
  margin-bottom: 55px;
}

.year {
  font-size: 30px;
  font-weight: 700;
  border-bottom: 1px solid #e9e6df;
  padding-bottom: 15px;
  margin: 35px 0 20px;
}

.archive-item {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 20px;
  padding: 18px 0;
  border-bottom: 1px solid #eeeae3;
}

.archive-date {
  color: #aaa;
  font-size: 13px;
}

.archive-title {
  font-size: 17px;
  font-weight: 600;
}

.archive-title:hover {
  color: #a17b51;
}

.archive-category {
  color: #a17b51;
  font-size: 12px;
  margin-top: 5px;
}

.empty {
  color: #999;
  padding: 25px 0;
}

footer {
  text-align: center;
  padding: 35px 20px;
  border-top: 1px solid #e9e6df;
  color: #999;
  font-size: 13px;
}

@media (max-width: 650px) {
  header {
    flex-direction: column;
    gap: 15px;
  }

  .container {
    margin-top: 55px;
  }

  .archive-item {
    grid-template-columns: 85px 1fr;
    gap: 10px;
  }
}
.archive-description {
  color: #999;
  font-size: 13px;
  margin-top: 6px;
  line-height: 1.7;
  max-width: 620px;
}

/* 归档分类筛选 */
.archive-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: -25px 0 35px;
}

.archive-filters button {
  border: 1px solid #e9e6df;
  background: transparent;
  color: #777;
  padding: 7px 17px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.25s ease;
}

.archive-filters button:hover,
.archive-filters button.active {
  background: #a17b51;
  border-color: #a17b51;
  color: #fff;
}

.archive-count {
  color: #999;
  font-size: 13px;
  margin: -25px 0 25px;
  letter-spacing: 0.5px;
}

  .archive-empty {
  color: #999;
  font-size: 14px;
  padding: 30px 0;
  text-align: center;
}
  
</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">SPL JOURNAL.</a>

  <nav>
    <a href="index.html">首页</a>
    <a href="index.html#articles">文章</a>
    <a href="archive.html">归档</a>
  </nav>
</header>

<main class="container">

  <div class="eyebrow">THE ARCHIVE</div>

  <h1>文章归档</h1>

  <p class="intro">
    每一篇文章，都是一段时间的记录。
    在这里，重新发现过去的思考。
  </p>
  <p id="archive-count" class="archive-count">
  正在统计文章...
</p>
  <div id="archive-filters" class="archive-filters">
  <button class="active" data-category="全部">全部</button>
  <button data-category="科技">科技</button>
  <button data-category="生活">生活</button>
  <button data-category="思考">思考</button>
  <button data-category="随笔">随笔</button>
</div>

  <div id="archive-list">
    正在加载文章...
  </div>

  <p id="archive-empty" class="archive-empty" hidden>
  这个分类暂时还没有文章，敬请期待。
</p>

</main>

<footer>
  © 2026 SPL JOURNAL. ALL RIGHTS RESERVED.
  <br>
  Made with curiosity.
</footer>

<script>
async function loadArchive() {
  const container = document.getElementById("archive-list");

  try {
    const response = await fetch("posts.json");

    if (!response.ok) {
      throw new Error("无法读取文章清单");
    }

    const posts = await response.json();

    if (!Array.isArray(posts)) {
      throw new Error("文章清单格式不正确");
    }

    const validPosts = posts
      .filter(post =>
        typeof post.file === "string" &&
        post.file.startsWith("posts/") &&
        !post.file.includes("..") &&
        /\.(md|html)$/i.test(post.file) &&
        /^\d{4}-\d{2}-\d{2}$/.test(post.date)
      )
      .sort((a, b) => b.date.localeCompare(a.date));
    // 显示文章总数
const archiveCount = document.getElementById("archive-count");

if (archiveCount) {
  archiveCount.textContent =
    "目前共收录 " + validPosts.length + " 篇文章";
}

    container.replaceChildren();

    if (validPosts.length === 0) {
      container.textContent = "暂时还没有文章。";
      return;
    }

    const groups = {};

    validPosts.forEach(post => {
      const year = post.date.slice(0, 4);

      if (!groups[year]) {
        groups[year] = [];
      }

      groups[year].push(post);
    });

    Object.keys(groups)
      .sort((a, b) => b.localeCompare(a))
      .forEach(year => {
        const section = document.createElement("section");

        const heading = document.createElement("h2");
heading.className = "year";

const count = groups[year].length;

heading.textContent = year + " · " + count + " 篇文章";

        section.appendChild(heading);

        groups[year].forEach(post => {
          const item = document.createElement("div");
          item.className = "archive-item";
          item.dataset.category = post.category || "随笔";

          const date = document.createElement("div");
date.className = "archive-date";

const monthDay = post.date.slice(5);
date.textContent = monthDay.replace("-", ".");

          const content = document.createElement("div");

          const link = document.createElement("a");
          link.className = "archive-title";
          link.textContent = post.title || "未命名文章";

          link.href = post.file.endsWith(".md")
            ? "post.html?file=" + encodeURIComponent(post.file)
            : post.file;

          const category = document.createElement("div");
          category.className = "archive-category";
          category.textContent = post.category || "随笔";

          const description = document.createElement("p");
description.className = "archive-description";
description.textContent = post.description || "";

content.append(link, category, description);
          item.append(date, content);
          section.appendChild(item);
        });

        container.appendChild(section);
      });

  } catch (error) {
    console.error(error);
    container.textContent = "文章归档加载失败，请检查 posts.json。";
  }
}

loadArchive();
  // 归档分类筛选功能
const filterButtons = document.querySelectorAll(
  "#archive-filters button"
);

filterButtons.forEach(button => {
  button.addEventListener("click", () => {
    const category = button.dataset.category;

    // 更新按钮选中状态
    filterButtons.forEach(item => {
      item.classList.remove("active");
    });

    button.classList.add("active");

    // 筛选文章
    document.querySelectorAll(".archive-item").forEach(item => {
      const match =
        category === "全部" ||
        item.dataset.category === category;

      item.style.display = match ? "grid" : "none";
    });

    // 隐藏没有文章的年份
    document.querySelectorAll("#archive-list section").forEach(section => {
      const visibleItems = section.querySelectorAll(
        '.archive-item:not([style*="display: none"])'
      );

      section.style.display =
        visibleItems.length > 0 ? "block" : "none";
    });
  });
});
</script>

</body>
</html>
