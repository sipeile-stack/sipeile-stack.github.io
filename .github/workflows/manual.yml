# This is a basic workflow that is manually triggered

name: Manual workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  check-website:
    name: Check SPL JOURNAL
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f post.html
          test -f posts.json
          test -f archive.html
          test -f favorites.html

      - name: Check posts.json format
        run: python -m json.tool posts.json > /dev/null
      - name: Check article files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          posts = json.loads(
              Path("posts.json").read_text(encoding="utf-8")
          )

          for post in posts:
              file = post.get("file")

              if (
                  not isinstance(file, str)
                  or not file.startswith("posts/")
                  or not file.endswith(".md")
                  or ".." in Path(file).parts
              ):
                  raise SystemExit(f"Invalid article path: {file}")

              if not Path(file).is_file():
                  raise SystemExit(f"Missing article file: {file}")

          print(f"Successfully checked {len(posts)} article files.")
          PY

      - name: Check required article fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          posts = json.loads(
              Path("posts.json").read_text(encoding="utf-8")
          )

          required_fields = [
              "title",
              "category",
              "date",
              "description",
              "file"
          ]

          for index, post in enumerate(posts, start=1):
              for field in required_fields:
                  if not isinstance(post.get(field), str) or not post[field].strip():
                      raise SystemExit(
                          f"Article {index} is missing or has an empty field: {field}"
                      )

          print("All article fields are complete.")
          PY
      - name: Check article date format
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime

          posts = json.loads(
              Path("posts.json").read_text(encoding="utf-8")
          )

          for index, post in enumerate(posts, start=1):
              date = post.get("date", "")

              try:
                  parsed = datetime.strptime(date, "%Y-%m-%d")
                  if parsed.strftime("%Y-%m-%d") != date:
                      raise ValueError
              except (ValueError, TypeError):
                  raise SystemExit(
                      f"Article {index} has an invalid date: {date}"
                  )

          print("All article dates are valid.")
          PY
      - name: Check article categories
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          posts = json.loads(
              Path("posts.json").read_text(encoding="utf-8")
          )

          allowed_categories = {
              "科技",
              "生活",
              "思考",
              "随笔"
          }

          for index, post in enumerate(posts, start=1):
              category = post.get("category")

              if category not in allowed_categories:
                  raise SystemExit(
                      f"Article {index} has an invalid category: {category}"
                  )

          print("All article categories are valid.")
          PY
      - name: Check duplicate article titles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          posts = json.loads(
              Path("posts.json").read_text(encoding="utf-8")
          )

          titles = [
              post["title"].strip()
              for post in posts
          ]

          if len(titles) != len(set(titles)):
              seen = set()

              for title in titles:
                  if title in seen:
                      raise SystemExit(
                          f"Duplicate article title: {title}"
                      )
                  seen.add(title)

          print("All article titles are unique.")
          PY
      - name: Check article descriptions
        run: |
          python -c 'import json; from pathlib import Path; posts=json.loads(Path("posts.json").read_text(encoding="utf-8")); errors=[f"Article {i} has an invalid description." for i,p in enumerate(posts,1) if not isinstance(p.get("description"),str) or not p["description"].strip() or len(p["description"].strip())>200]; [print(e) for e in errors]; print("All article descriptions are valid.") if not errors else None; raise SystemExit(bool(errors))'

      - name: Check article content
        run: |
          python -c 'import json; from pathlib import Path; posts=json.loads(Path("posts.json").read_text(encoding="utf-8")); errors=["Article "+str(p.get("file"))+" is missing or empty." for p in posts if not isinstance(p.get("file"),str) or not Path(p["file"]).is_file() or not Path(p["file"]).read_text(encoding="utf-8").strip()]; [print(e) for e in errors]; print("All article files contain content.") if not errors else None; raise SystemExit(bool(errors))'
      - name: Check featured article settings
        run: |
          python -c 'import json; from pathlib import Path; posts=json.loads(Path("posts.json").read_text(encoding="utf-8")); invalid=[str(i) for i,p in enumerate(posts,1) if "featured" in p and not isinstance(p["featured"],bool)]; featured=[str(p.get("title","(untitled)")) for p in posts if p.get("featured") is True]; [print("Invalid featured field in article "+i) for i in invalid]; print("Multiple featured articles: "+", ".join(featured)) if len(featured)>1 else None; print("Featured article settings are valid.") if not invalid and len(featured)<=1 else None; raise SystemExit(bool(invalid) or len(featured)>1)'
      - name: Check article file extensions
        run: |
          python -c 'import json; from pathlib import Path; posts=json.loads(Path("posts.json").read_text(encoding="utf-8")); invalid=[str(p.get("file")) for p in posts if not isinstance(p.get("file"),str) or Path(p["file"]).suffix.lower()!=".md"]; [print("Invalid article file extension: "+f) for f in invalid]; print("All article file extensions are valid.") if not invalid else None; raise SystemExit(bool(invalid))'
      - name: Check article path safety
        run: |
          python -c 'import json; from pathlib import Path; posts=json.loads(Path("posts.json").read_text(encoding="utf-8")); invalid=[str(p.get("file")) for p in posts if not isinstance(p.get("file"),str) or not Path(p["file"]).as_posix().startswith("posts/") or ".." in Path(p["file"]).parts]; [print("Unsafe article path: "+f) for f in invalid]; print("All article paths are safe.") if not invalid else None; raise SystemExit(bool(invalid))'
      - name: Check article category formatting
        run: |
          python -c 'import json; from pathlib import Path; posts=json.loads(Path("posts.json").read_text(encoding="utf-8")); invalid=[str(i) for i,p in enumerate(posts,1) if not isinstance(p.get("category"),str) or p["category"] != p["category"].strip()]; [print("Article "+i+" has extra spaces in category.") for i in invalid]; print("All article categories are properly formatted.") if not invalid else None; raise SystemExit(bool(invalid))'
      - name: Check duplicate article file paths
        run: |
          python -c 'import json; from pathlib import Path; posts=json.loads(Path("posts.json").read_text(encoding="utf-8")); files=[p["file"].strip() for p in posts]; duplicates=sorted({f for f in files if files.count(f)>1}); [print("Duplicate article file path: "+f) for f in duplicates]; print("All article file paths are unique.") if not duplicates else None; raise SystemExit(bool(duplicates))'
