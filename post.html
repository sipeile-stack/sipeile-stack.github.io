<script>
  
async function loadPostNavigation(currentFile) {
  const navigation = document.getElementById("post-navigation");
  if (!navigation) {
  console.error("找不到 post-navigation 导航容器");
  return;
}

  try {
    const response = await fetch("posts.json");

    if (!response.ok) {
      throw new Error("无法读取文章清单");
    }

    const posts = await response.json();

    const validPosts = posts.filter(post =>
      typeof post.file === "string" &&
      post.file.startsWith("posts/") &&
      !post.file.includes("..") &&
      /\.(md|html)$/i.test(post.file)
    );

    // 按发布日期从新到旧排序
validPosts.sort((a, b) =>
  new Date(b.date) - new Date(a.date)
);

    const index = validPosts.findIndex(
      post => post.file === currentFile
    );

    if (index === -1) return;

    const previous = validPosts[index - 1];
    const next = validPosts[index + 1];

    // 自动推荐另外两篇文章
const relatedList = document.getElementById("related-list");

if (relatedList) {
  const recommendedPosts = validPosts
    .filter(post => post.file !== currentFile)
    .slice(0, 2);

  recommendedPosts.forEach(post => {
    const card = document.createElement("a");
    card.className = "related-card";

    card.href = post.file.endsWith(".md")
      ? "post.html?file=" + encodeURIComponent(post.file)
      : post.file;

    const category = document.createElement("span");
    category.className = "related-category";
    category.textContent = post.category || "随笔";

    const title = document.createElement("h3");
    title.textContent = post.title || "未命名文章";

    const description = document.createElement("p");
    description.textContent = post.description || "";

    card.append(category, title, description);
    relatedList.appendChild(card);
  });
}

    function createLink(post, label) {
      if (!post) return null;

      const link = document.createElement("a");

      link.href = post.file.endsWith(".md")
        ? "post.html?file=" + encodeURIComponent(post.file)
        : post.file;

      const span = document.createElement("span");
      span.textContent = label;

      const strong = document.createElement("strong");
      strong.textContent = post.title || "未命名文章";

      link.append(span, strong);
      return link;
    }

    const previousLink = createLink(previous, "← 上一篇");
    const nextLink = createLink(next, "下一篇 →");

    if (previousLink) navigation.appendChild(previousLink);
    if (nextLink) navigation.appendChild(nextLink);

  } catch (error) {
    console.error("文章导航加载失败：", error);
  }
}

async function loadArticle() {
  

  const content = document.getElementById("content");

  try {

    const params = new URLSearchParams(location.search);
    const file = params.get("file");
    loadPostNavigation(file);

    if (
      !file ||
      !file.startsWith("posts/") ||
      !file.endsWith(".md") ||
      file.includes("..")
    ) {
      throw new Error("文章地址不正确");
    }

    const response = await fetch(file);

    if (!response.ok) {
      throw new Error("没有找到文章文件");
    }

    const markdown = await response.text();

    const titleMatch = markdown.match(/^#\s+(.+)$/m);

    if (titleMatch) {
      document.title = titleMatch[1] + " | SPL JOURNAL";
    }

    const html = marked.parse(markdown);

    content.innerHTML = DOMPurify.sanitize(html);
    const headings = content.querySelectorAll("h2, h3");

const toc = document.getElementById("table-of-contents");
const tocList = document.getElementById("toc-list");
    
console.log("目录容器：", toc);
console.log("目录列表：", tocList);

tocList.innerHTML = "";

if (headings.length > 0) {
  headings.forEach((heading, index) => {
    const id = "section-" + index;

    heading.id = id;

    const li = document.createElement("li");
    li.className = heading.tagName.toLowerCase() === "h3"
      ? "toc-h3"
      : "toc-h2";

    const link = document.createElement("a");
    link.href = "#" + id;
    link.textContent = heading.innerText;

    link.addEventListener("click", (event) => {
  event.preventDefault();

  const targetTop =
    heading.getBoundingClientRect().top +
    window.scrollY - 100;

  window.scrollTo({
    top: targetTop,
    behavior: "smooth"
  });

  history.replaceState(null, "", "#" + id);
});

    li.appendChild(link);
    tocList.appendChild(li);
  });

  toc.style.display = "block";
  const tocToggle = document.getElementById("toc-toggle");
const tocArrow = document.getElementById("toc-arrow");

tocToggle.addEventListener("click", () => {
  const isHidden = tocList.style.display === "none";

  tocList.style.display = isHidden ? "block" : "none";
  tocArrow.textContent = isHidden ? "−" : "+";
});
  function updateActiveHeading() {
  let currentHeading = headings[0];

  for (const heading of headings) {
    if (heading.getBoundingClientRect().top <= 150) {
      currentHeading = heading;
    }
  }

  // 如果已经滚动到文章底部，高亮最后一个章节
  const isAtBottom =
    window.innerHeight + window.scrollY >=
    document.documentElement.scrollHeight - 10;

  if (isAtBottom) {
    currentHeading = headings[headings.length - 1];
  }

  tocList.querySelectorAll("a").forEach(link => {
    link.classList.remove("active");
  });

  if (currentHeading) {
    const activeLink = tocList.querySelector(
      'a[href="#' + currentHeading.id + '"]'
    );

    if (activeLink) {
      activeLink.classList.add("active");
    }
  }
}

window.addEventListener("scroll", updateActiveHeading);
window.addEventListener("resize", updateActiveHeading);

updateActiveHeading();
}
    const textContent = content.innerText;

const chineseCharacters = (
  textContent.match(/[\u4e00-\u9fff]/g) || []
).length;

const englishWords = (
  textContent.match(/[a-zA-Z0-9]+/g) || []
).length;

const totalWords = chineseCharacters + englishWords;

const readingMinutes = Math.max(
  1,
  Math.ceil(totalWords / 300)
);

document.getElementById("reading-time").textContent =
  "预计阅读 " + readingMinutes + " 分钟";

  } catch (error) {

    content.innerHTML =
      '<div class="error">' +
      '文章加载失败：' + error.message +
      '<br>请检查文章文件是否存在，以及网络是否正常。' +
      '</div>';

  }
}

loadArticle();

  // SPL JOURNAL 文章收藏功能
function initFavorite() {
  const favoriteToggle =
    document.getElementById("favorite-toggle");

  if (!favoriteToggle) {
    console.error("找不到收藏按钮");
    return;
  }

  const params = new URLSearchParams(location.search);
  const file = params.get("file");

  if (!file) return;

  const storageKey = "spl-favorites";

  function getFavorites() {
    try {
      return JSON.parse(
        localStorage.getItem(storageKey) || "[]"
      );
    } catch (error) {
      return [];
    }
  }

  function updateButton() {
    const favorites = getFavorites();
    const isFavorite = favorites.includes(file);

    favoriteToggle.textContent =
      isFavorite ? "★ 已收藏" : "☆ 收藏";

    favoriteToggle.classList.toggle(
      "is-favorite",
      isFavorite
    );
  }

  favoriteToggle.addEventListener("click", () => {
    let favorites = getFavorites();

    if (favorites.includes(file)) {
      favorites = favorites.filter(item => item !== file);
    } else {
      favorites.push(file);
    }

    localStorage.setItem(
  
      storageKey,
      JSON.stringify(favorites)
    );

    updateButton();
  });

  updateButton();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initFavorite);
} else {
  initFavorite();
}
  // SPL JOURNAL V9.0 文章分享功能
// SPL JOURNAL V9.1 原生分享功能
function initShare() {
  const shareButton =
    document.getElementById("share-toggle");

  if (!shareButton) return;

  shareButton.addEventListener("click", async () => {
    const shareData = {
      title: document.title,
      text: "推荐阅读：",
      url: window.location.href
    };

    // 支持原生分享的设备
    if (navigator.share) {
      try {
        await navigator.share(shareData);
        shareButton.textContent = "✓ 分享成功";

        setTimeout(() => {
          shareButton.textContent = "↗ 分享";
        }, 2000);

      } catch (error) {
        if (error.name !== "AbortError") {
          console.error("分享失败：", error);
        }
      }

      return;
    }

    // 不支持原生分享时，使用复制链接
    try {
      await navigator.clipboard.writeText(
        window.location.href
      );

      shareButton.textContent = "✓ 已复制";

      setTimeout(() => {
        shareButton.textContent = "↗ 分享";
      }, 2000);

    } catch (error) {
      console.error("复制链接失败：", error);
      shareButton.textContent = "复制失败";
    }
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initShare);
} else {
  initShare();
  
}

  // SPL JOURNAL V10.0 Giscus 评论系统
function initGiscus() {
  const container = document.getElementById("giscus-container");

  if (!container) return;

  // 获取当前文章路径
  const params = new URLSearchParams(location.search);
  const file = params.get("file");

  if (!file) return;

  // 根据文章文件名生成独立评论标识
  const articleId = file
    .replace(/^posts\//, "")
    .replace(/\.(md|html)$/i, "")
    .replace(/[^a-zA-Z0-9_-]/g, "-");

  const script = document.createElement("script");

  script.src = "https://giscus.app/client.js";
  script.async = true;
  script.crossOrigin = "anonymous";

  script.setAttribute("data-repo", "sipeile-stack/sipeile-stack.github.io");
  script.setAttribute("data-repo-id", "R_kgDOV3WN4g");
  script.setAttribute("data-category", "General");
  script.setAttribute("data-category-id", "DIC_kwDOV3WN4s4DL1nw");

  script.setAttribute("data-mapping", "specific");
  script.setAttribute("data-term", "spl-journal-" + articleId);
  script.setAttribute("data-strict", "0");

  script.setAttribute("data-reactions-enabled", "1");
  script.setAttribute("data-emit-metadata", "0");
  script.setAttribute("data-input-position", "bottom");
  script.setAttribute("data-theme", "light");
  script.setAttribute("data-lang", "zh-CN");

  container.appendChild(script);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initGiscus);
} else {
  initGiscus();
}

  // 文章字体大小调节
function initFontControls() {
  const content = document.getElementById("content");
  const decrease = document.getElementById("font-decrease");
  const reset = document.getElementById("font-reset");
  const increase = document.getElementById("font-increase");

  if (!content || !decrease || !reset || !increase) {
    console.error("字体调节按钮初始化失败");
    return;
  }

  let fontSize = 16;

  function updateFontSize() {
    content.style.fontSize = fontSize + "px";
    localStorage.setItem("spl-font-size", fontSize);
  }

  const savedSize = Number(localStorage.getItem("spl-font-size"));

  if (savedSize >= 12 && savedSize <= 24) {
    fontSize = savedSize;
  }

  updateFontSize();

  decrease.addEventListener("click", () => {
    console.log("缩小字体按钮已点击");
    fontSize = Math.max(12, fontSize - 1);
    updateFontSize();
  });

  increase.addEventListener("click", () => {
    fontSize = Math.min(24, fontSize + 1);
    updateFontSize();
  });

  reset.addEventListener("click", () => {
    fontSize = 16;
    updateFontSize();
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initFontControls);
} else {
  initFontControls();
}
  // 返回顶部按钮
function initBackToTop() {
  const backToTop = document.getElementById("back-to-top");

  if (!backToTop) {
    console.error("找不到返回顶部按钮");
    return;
  }

  window.addEventListener("scroll", () => {
    if (window.scrollY > 100) {
      backToTop.style.display = "block";
    } else {
      backToTop.style.display = "none";
    }
  });

  backToTop.addEventListener("click", () => {
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initBackToTop);
} else {
  initBackToTop();
}
  
function updateReadingProgress() {
  const progressBar = document.getElementById("reading-progress");

  if (!progressBar) {
    console.error("找不到阅读进度条");
    return;
  }

  const scrollableHeight =
    document.documentElement.scrollHeight - window.innerHeight;

  if (scrollableHeight <= 0) {
    progressBar.style.width = "100%";
    return;
  }

  const progress =
    (window.scrollY / scrollableHeight) * 100;

  progressBar.style.width =
    Math.min(100, Math.max(0, progress)) + "%";
}

window.addEventListener("scroll", updateReadingProgress);
window.addEventListener("resize", updateReadingProgress);

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", updateReadingProgress);
} else {
  updateReadingProgress();
}

// 阅读模式切换与记忆
function initThemeToggle() {
  const themeToggle = document.getElementById("theme-toggle");

  if (!themeToggle) {
    console.error("找不到阅读模式按钮");
    return;
  }

  // 读取上次保存的阅读模式
  const savedTheme = localStorage.getItem("spl-theme");

  if (savedTheme === "dark") {
    document.body.classList.add("dark-mode");
    themeToggle.textContent = "☀";
  } else {
    document.body.classList.remove("dark-mode");
    themeToggle.textContent = "☾";
  }

  // 点击切换并保存
  themeToggle.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");

    const isDark =
      document.body.classList.contains("dark-mode");

    themeToggle.textContent = isDark ? "☀" : "☾";

    localStorage.setItem(
      "spl-theme",
      isDark ? "dark" : "light"
    );
    syncGiscusTheme();
  });
}
  // SPL JOURNAL V10.1：同步 Giscus 评论区主题
function syncGiscusTheme() {
  const isDark =
    document.body.classList.contains("dark-mode");

  const giscusFrame =
    document.querySelector("iframe.giscus-frame");

  if (!giscusFrame) return;

  giscusFrame.contentWindow.postMessage(
    {
      giscus: {
        setConfig: {
          theme: isDark ? "dark" : "light"
        }
      }
    },
    "https://giscus.app"
  );
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initThemeToggle);
} else {
  initThemeToggle();
}
