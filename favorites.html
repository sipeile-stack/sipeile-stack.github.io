
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我的收藏 | SPL JOURNAL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f7f4;
      color: #252525;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 30px 8%;
      border-bottom: 1px solid #e5e1da;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    nav {
      margin-top: 22px;
    }

    nav a {
      margin-right: 24px;
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #a17b51;
    }

    main {
      max-width: 1000px;
      margin: 80px auto;
      padding: 0 25px;
      min-height: 500px;
    }

    .eyebrow {
      color: #a17b51;
      font-size: 12px;
      letter-spacing: 3px;
    }

    h1 {
      font-size: 42px;
      margin: 15px 0;
    }

    .subtitle {
      color: #888;
      font-size: 15px;
      margin-bottom: 55px;
    }

    .favorite-item {
      padding: 25px 0;
      border-bottom: 1px solid #e5e1da;
    }

    .favorite-item a {
      color: #252525;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
    }

    .favorite-item a:hover {
      color: #a17b51;
    }

    .favorite-meta {
      margin-top: 12px;
      color: #999;
      font-size: 13px;
    }

    .empty {
      padding: 60px 0;
      color: #999;
      text-align: center;
    }

    footer {
      padding: 35px;
      text-align: center;
      color: #999;
      font-size: 12px;
      border-top: 1px solid #e5e1da;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">SPL JOURNAL.</div>

    <nav>
      <a href="index.html">首页</a>
      <a href="index.html#articles">文章</a>
      <a href="archive.html">归档</a>
      <a href="favorites.html">我的收藏</a>
    </nav>
  </header>

  <main>
    <div class="eyebrow">MY COLLECTION</div>

    <h1>我的收藏</h1>

    <p class="subtitle">
      收藏值得反复阅读的文字。
    </p>

    <div id="favorite-list">
      <div class="empty">收藏列表正在准备中……</div>
    </div>
  </main>

  <footer>
    SPL JOURNAL. · A JOURNAL OF THOUGHTS.
  </footer>


<script>
// SPL JOURNAL 收藏列表
async function loadFavorites() {
  const favoriteList = document.getElementById("favorite-list");

  try {
    // 读取本地收藏记录
    const favorites = JSON.parse(
      localStorage.getItem("spl-favorites") || "[]"
    );

    // 读取网站文章清单
    const response = await fetch("posts.json");

    if (!response.ok) {
      throw new Error("文章清单加载失败");
    }

    const posts = await response.json();

    // 找出已经收藏的文章
    const favoritePosts = posts.filter(post =>
      favorites.includes(post.file)
    );

    favoriteList.innerHTML = "";

    // 没有收藏文章时
    if (favoritePosts.length === 0) {
      favoriteList.textContent = "暂时还没有收藏文章，去阅读并收藏一些喜欢的文章吧。";
      favoriteList.className = "empty";
      return;
    }

    // 显示收藏文章
    favoritePosts.forEach(post => {
      const item = document.createElement("div");
      item.className = "favorite-item";

      const link = document.createElement("a");

      link.href = post.file.endsWith(".md")
        ? "post.html?file=" + encodeURIComponent(post.file)
        : post.file;

      link.textContent = post.title;

      const meta = document.createElement("div");
      meta.className = "favorite-meta";
      meta.textContent =
        (post.category || "未分类") + " · " +
        (post.date || "");

      item.appendChild(link);
      item.appendChild(meta);

      favoriteList.appendChild(item);
    });

  } catch (error) {
    favoriteList.textContent = "收藏列表加载失败，请刷新页面重试。";
    console.error("收藏列表加载失败：", error);
  }
}

loadFavorites();
</script>


</body>
</html>
